# docker-compose.cp.yml — Confluent Platform (local) mode.
#
# Starts three services for the CP use-case:
#   kafka          — single-node KRaft broker with jmx_prometheus_javaagent on :1234
#   otel-collector — receives OTLP push metrics from the Python app → New Relic
#   nri-prometheus — scrapes Kafka JMX metrics on :1234 → New Relic directly
#
# Usage (via start-infra-cp.sh, or manually):
#   docker compose -f docker-compose.cp.yml up -d
#
# Required env vars: NEW_RELIC_LICENSE_KEY, NEW_RELIC_OTLP_ENDPOINT

services:

  # ── Kafka broker (KRaft, single-node) with JMX Prometheus Java Agent ─────────
  kafka:
    image: confluentinc/cp-kafka:8.3.1
    hostname: kafka
    ports:
      - "29092:29092"
    volumes:
      - ./jmx-exporter:/usr/share/jmx-exporter:ro
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: CONTROLLER://:9093,PLAINTEXT://:9092,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # Attach JMX exporter on port 1234 — rules from confluentinc/jmx-monitoring-stacks
      EXTRA_ARGS: >-
        -javaagent:/usr/share/jmx-exporter/jmx_prometheus_javaagent-1.0.1.jar=1234:/usr/share/jmx-exporter/kafka_broker.yml

  # ── OTel Collector — OTLP push metrics + Kafka broker log ingestion ──────────
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.160.0
    command: ["--config=/etc/otelcol-contrib/otel-collector.yaml"]
    environment:
      NEW_RELIC_LICENSE_KEY: ${NEW_RELIC_LICENSE_KEY:?Set NEW_RELIC_LICENSE_KEY before starting the Collector}
      NEW_RELIC_OTLP_ENDPOINT: ${NEW_RELIC_OTLP_ENDPOINT:-https://otlp.eu01.nr-data.net}
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:-dev}
    volumes:
      - ./collector/otel-collector.yaml:/etc/otelcol-contrib/otel-collector.yaml:ro
      # Docker JSON log files — the filelog receiver tails kafka*.log inside the
      # Collector container. Files are read-only; no Docker socket needed.
      - /var/lib/docker/containers:/var/log/containers:ro
    ports:
      - "4317:4317"
      - "4318:4318"

  # ── nri-prometheus — scrapes Kafka JMX endpoint → New Relic directly ─────────
  nri-prometheus:
    image: newrelic/nri-prometheus:2.30.0
    container_name: nri-prometheus
    restart: unless-stopped
    environment:
      LICENSE_KEY: ${NEW_RELIC_LICENSE_KEY:?Set NEW_RELIC_LICENSE_KEY before starting nri-prometheus}
    volumes:
      - ./jmx-exporter/nri-prometheus-config.yaml:/config.yaml:ro
    depends_on:
      - kafka
