# OTel Collector config for Confluent Cloud mode.
#
# Four pipelines run in parallel:
#
#   confluent_metrics  — prometheus receiver scrapes the Confluent Metrics API
#                        (api.telemetry.confluent.cloud) every 60 s and pushes
#                        cluster/connector/schema-registry metrics to New Relic.
#
#   app_metrics        — otlp receiver accepts metrics pushed by the Python
#                        producer/consumer (same port as the local-Kafka config)
#                        and forwards them to New Relic.
#
#   audit_logs         — kafka receiver consumes the confluent-audit-log-events
#                        topic on the Confluent Cloud audit log cluster and
#                        forwards log records to New Relic.
#
#   connector_logs     — kafka receiver consumes the confluent-connect-log-events
#                        topic on the same audit log cluster (same bootstrap and
#                        credentials) and forwards managed connector log records
#                        to New Relic.
#
# Required env vars (see env.example):
#   NEW_RELIC_LICENSE_KEY, NEW_RELIC_OTLP_ENDPOINT
#   CONFLUENT_API_KEY, CONFLUENT_API_SECRET
#   CONFLUENT_CLUSTER_ID
#   CONFLUENT_AUDIT_BOOTSTRAP_SERVERS, CONFLUENT_AUDIT_SASL_USERNAME, CONFLUENT_AUDIT_SASL_PASSWORD
# Optional (uncomment the matching params blocks below if set):
#   CONFLUENT_SCHEMA_REGISTRY_ID
#   CONFLUENT_CONNECTOR_ID

receivers:

  # ── 1. Confluent Metrics API scraper ─────────────────────────────────────────
  prometheus/confluent:
    config:
      scrape_configs:
        - job_name: confluent_cloud
          scrape_interval: 1m
          scrape_timeout: 1m
          honor_timestamps: true
          scheme: https
          static_configs:
            - targets:
                - api.telemetry.confluent.cloud
          basic_auth:
            username: ${env:CONFLUENT_API_KEY}
            password: ${env:CONFLUENT_API_SECRET}
          metrics_path: /v2/metrics/cloud/export
          params:
            "resource.kafka.id":
              - ${env:CONFLUENT_CLUSTER_ID}
            # Uncomment to also scrape Schema Registry metrics:
            # "resource.schema_registry.id":
            #   - ${env:CONFLUENT_SCHEMA_REGISTRY_ID}
            # Uncomment to also scrape Connector metrics:
            # "resource.connector.id":
            #   - ${env:CONFLUENT_CONNECTOR_ID}

  # ── 2. OTLP receiver — accepts push metrics from the Python app ──────────────
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  # ── 3. Confluent Cloud audit log consumer ────────────────────────────────────
  # Reads from the confluent-audit-log-events topic on the dedicated audit log
  # cluster (separate bootstrap endpoint and credentials from the main cluster).
  # Audit log records are JSON-encoded CloudEvents delivered as Kafka messages;
  # encoding: raw preserves the raw bytes as the log record body.
  #
  # Audit log cluster bootstrap and credentials can be found in the Confluent
  # Cloud UI under "Audit log cluster" or via: confluent audit-log describe
  # A service account with the OrganizationAdmin or AuditLogViewer role is needed.
  kafka/audit:
    brokers:
      - ${env:CONFLUENT_AUDIT_BOOTSTRAP_SERVERS}
    group_id: otel-collector-audit-log
    initial_offset: latest
    logs:
      topics:
        - confluent-audit-log-events
      encoding: json
    tls:
      insecure: false
    auth:
      sasl:
        username: ${env:CONFLUENT_AUDIT_SASL_USERNAME}
        password: ${env:CONFLUENT_AUDIT_SASL_PASSWORD}
        mechanism: PLAIN

  # ── 4. Confluent Cloud managed connector log consumer ────────────────────────
  # Reads from the confluent-connect-log-events topic on the same audit log
  # cluster as kafka/audit (same bootstrap servers and credentials).
  # Each message contains a JSON log record emitted by a managed connector task.
  #
  # Topic name confirmed via: confluent connect event describe
  # The service account used for kafka/audit already has access to this topic.
  kafka/connector_logs:
    brokers:
      - ${env:CONFLUENT_AUDIT_BOOTSTRAP_SERVERS}
    group_id: otel-collector-connector-logs
    initial_offset: latest
    logs:
      topics:
        - confluent-connect-log-events
      encoding: json
    tls:
      insecure: false
    auth:
      sasl:
        username: ${env:CONFLUENT_AUDIT_SASL_USERNAME}
        password: ${env:CONFLUENT_AUDIT_SASL_PASSWORD}
        mechanism: PLAIN

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
  batch:
    send_batch_size: 1024
    timeout: 10s

  # Parse the CloudEvent `time` field (RFC3339Nano) and promote it to the OTel
  # log record timestamp so New Relic uses the event time, not ingestion time.
  # encoding: json places the whole parsed JSON into the log body as a Map —
  # top-level CloudEvent fields (time, subject, source) are therefore at
  # body["field"], not attributes["field"]. Read from body; write to attributes.
  transform/audit:
    log_statements:
      - context: log
        statements:
          - set(time, Time(body["time"], "%Y-%m-%dT%H:%M:%S.%fZ")) where body["time"] != nil
          - set(attributes["confluent.log.source"], "confluent-audit")
          # Break down the subject CRN into individual labels for easy filtering in New Relic.
          # subject format: crn://confluent.cloud/organization=X/environment=Y/<resource>=Z[/...]
          - set(attributes["crn.organization"], ExtractPatterns(body["subject"], "organization=(?P<v>[^/]+)")["v"]) where IsMatch(body["subject"], "organization=")
          - set(attributes["crn.environment"], ExtractPatterns(body["subject"], "environment=(?P<v>[^/]+)")["v"]) where IsMatch(body["subject"], "environment=")
          - set(attributes["crn.cloud_cluster"], ExtractPatterns(body["subject"], "cloud-cluster=(?P<v>[^/]+)")["v"]) where IsMatch(body["subject"], "cloud-cluster=")
          - set(attributes["crn.kafka"], ExtractPatterns(body["subject"], "kafka=(?P<v>[^/]+)")["v"]) where IsMatch(body["subject"], "kafka=")
          - set(attributes["crn.schema_registry"], ExtractPatterns(body["subject"], "schema-registry=(?P<v>[^/]+)")["v"]) where IsMatch(body["subject"], "schema-registry=")
          - set(attributes["crn.flink_region"], ExtractPatterns(body["subject"], "flink-region=(?P<v>[^/]+)")["v"]) where IsMatch(body["subject"], "flink-region=")
          - set(attributes["crn.compute_pool"], ExtractPatterns(body["subject"], "compute-pool=(?P<v>[^/]+)")["v"]) where IsMatch(body["subject"], "compute-pool=")

  transform/connector:
    log_statements:
      - context: log
        statements:
          - set(time, Time(body["time"], "%Y-%m-%dT%H:%M:%S.%fZ")) where body["time"] != nil
          - set(attributes["confluent.log.source"], "confluent-connector")
          # Break down the source CRN into individual labels for easy filtering in New Relic.
          # source format: crn://confluent.cloud/environment=X/kafka=Y/connector=Z
          - set(attributes["crn.environment"], ExtractPatterns(body["source"], "environment=(?P<v>[^/]+)")["v"]) where IsMatch(body["source"], "environment=")
          - set(attributes["crn.kafka"], ExtractPatterns(body["source"], "kafka=(?P<v>[^/]+)")["v"]) where IsMatch(body["source"], "kafka=")
          - set(attributes["crn.connector"], ExtractPatterns(body["source"], "connector=(?P<v>[^/]+)")["v"]) where IsMatch(body["source"], "connector=")

exporters:
  debug:
    verbosity: basic
  otlp_http/newrelic:
    endpoint: ${env:NEW_RELIC_OTLP_ENDPOINT}
    headers:
      api-key: ${env:NEW_RELIC_LICENSE_KEY}

service:
  pipelines:
    # Confluent Metrics API → New Relic
    metrics/confluent_metrics:
      receivers: [prometheus/confluent]
      processors: [memory_limiter, batch]
      exporters: [debug, otlp_http/newrelic]

    # Python app OTLP push → New Relic
    metrics/app_metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug, otlp_http/newrelic]

    # Confluent Cloud audit logs → New Relic
    logs/audit:
      receivers: [kafka/audit]
      processors: [memory_limiter, transform/audit, batch]
      exporters: [debug, otlp_http/newrelic]

    # Confluent Cloud managed connector logs → New Relic
    logs/connector:
      receivers: [kafka/connector_logs]
      processors: [memory_limiter, transform/connector, batch]
      exporters: [debug, otlp_http/newrelic]
