# OTel Collector config for Confluent Cloud mode.
#
# Always-on pipelines:
#
#   confluent_metrics  — prometheus receiver scrapes the Confluent Metrics API
#                        (api.telemetry.confluent.cloud) every 60 s → New Relic.
#
#   app_metrics        — otlp receiver accepts metrics pushed by the Python/Java
#                        producer/consumer → New Relic.
#
# Optional log pipelines — enabled at config-generation time by render-collector-ccloud.sh
# based on which environment variables are set. Exactly one of the two connector
# log methods should be enabled; both can coexist if needed.
#
#   [AUDIT_LOGS] block — enabled when all three are set:
#     CONFLUENT_AUDIT_BOOTSTRAP_SERVERS, CONFLUENT_AUDIT_SASL_USERNAME,
#     CONFLUENT_AUDIT_SASL_PASSWORD
#
#     audit_logs     — kafka receiver consumes confluent-audit-log-events
#     connector_logs — kafka receiver consumes confluent-connect-log-events
#                      (same audit cluster, same credentials)
#
#   [CLI_CONNECTOR_LOGS] block — enabled when both are set:
#     CONFLUENT_ENVIRONMENT_ID  (env-...)
#     CONFLUENT_CONNECTOR_IDS   (* or comma-separated lcc-... list)
#
#     connector_logs_cli — filelog receiver reads NDJSON from a named pipe
#                          written by infra/scripts/confluent-connector-logs.sh
#                          (the Confluent CLI wrapper). No audit cluster access
#                          required. Produces identical attributes to the
#                          [AUDIT_LOGS] connector_logs pipeline.
#
# Do not edit otel-collector-ccloud.resolved.yaml — it is generated by
# render-collector-ccloud.sh and is git-ignored.
#
# Required env vars (see env.example):
#   NEW_RELIC_LICENSE_KEY, NEW_RELIC_OTLP_ENDPOINT
#   CONFLUENT_API_KEY, CONFLUENT_API_SECRET, CONFLUENT_CLUSTER_ID
#
# Audit log path (Plan A):
#   CONFLUENT_AUDIT_BOOTSTRAP_SERVERS, CONFLUENT_AUDIT_SASL_USERNAME,
#   CONFLUENT_AUDIT_SASL_PASSWORD
#
# CLI wrapper path (CLI wrapper):
#   CONFLUENT_ENVIRONMENT_ID, CONFLUENT_CONNECTOR_IDS (or CONFLUENT_CONNECTOR_ID)

receivers:

  # ── 1. Confluent Metrics API scraper ─────────────────────────────────────────
  prometheus/confluent:
    config:
      scrape_configs:
        - job_name: confluent_cloud
          scrape_interval: 1m
          scrape_timeout: 1m
          honor_timestamps: true
          scheme: https
          static_configs:
            - targets:
                - api.telemetry.confluent.cloud
          basic_auth:
            username: ${env:CONFLUENT_API_KEY}
            password: ${env:CONFLUENT_API_SECRET}
          metrics_path: /v2/metrics/cloud/export
          params:
            "resource.kafka.id":
              # CONFLUENT_CLUSTER_ID_LIST — do not edit this line; render-collector-ccloud.sh
              # replaces it with one "- lkc-xxx" entry per cluster ID at startup time.
              # Set CONFLUENT_CLUSTER_ID to a single ID or a comma-separated list.
              - lkc-j3kzv8
              - lkc-8m3j27
            # Uncomment to also scrape Schema Registry metrics:
            # "resource.schema_registry.id":
            #   - ${env:CONFLUENT_SCHEMA_REGISTRY_ID}
            # Uncomment to also scrape Connector metrics:
            # "resource.connector.id":
            #   - ${env:CONFLUENT_CONNECTOR_ID}

  # ── 2. OTLP receiver — accepts push metrics from the Python/Java app ─────────
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  # ── 3a. Confluent Cloud audit log consumer ───────────────────────────────────
  # Reads from the confluent-audit-log-events topic on the dedicated audit log
  # cluster (separate bootstrap endpoint and credentials from the main cluster).
  # Audit log cluster bootstrap and credentials can be found in the Confluent
  # Cloud UI under "Audit log cluster", or via: confluent audit-log describe
  # A service account with the OrganizationAdmin or AuditLogViewer role is needed.
  kafka/audit:
    brokers:
      - ${env:CONFLUENT_AUDIT_BOOTSTRAP_SERVERS}
    group_id: otel-collector-audit-log
    initial_offset: latest
    logs:
      topics:
        - confluent-audit-log-events
      encoding: json
    tls:
      insecure: false
    auth:
      sasl:
        username: ${env:CONFLUENT_AUDIT_SASL_USERNAME}
        password: ${env:CONFLUENT_AUDIT_SASL_PASSWORD}
        mechanism: PLAIN

  # ── 3b. Confluent Cloud managed connector log consumer (audit cluster) ───────
  # Reads from the confluent-connect-log-events topic on the same audit log
  # cluster as kafka/audit (same bootstrap servers and credentials).
  # The service account used for kafka/audit already has access to this topic.
  kafka/connector_logs:
    brokers:
      - ${env:CONFLUENT_AUDIT_BOOTSTRAP_SERVERS}
    group_id: otel-collector-connector-logs
    initial_offset: latest
    logs:
      topics:
        - confluent-connect-log-events
      encoding: json
    tls:
      insecure: false
    auth:
      sasl:
        username: ${env:CONFLUENT_AUDIT_SASL_USERNAME}
        password: ${env:CONFLUENT_AUDIT_SASL_PASSWORD}
        mechanism: PLAIN


processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
  batch:
    send_batch_size: 1024
    timeout: 10s

  # ── transform/audit ──────────────────────────────────────────────────────────
  # Parse the CloudEvent `time` field and promote it to the OTel log timestamp.
  # encoding: json places parsed JSON into the log body as a Map; top-level
  # CloudEvent fields are at body["field"], not attributes["field"].
  transform/audit:
    log_statements:
      - context: log
        statements:
          - set(log.time, Time(log.body["time"], "%Y-%m-%dT%H:%M:%S.%fZ")) where log.body["time"] != nil
          - set(log.attributes["confluent.log.source"], "confluent-audit")
          # subject: crn://confluent.cloud/organization=X/environment=Y/<resource>=Z
          - set(log.attributes["crn.organization"],   ExtractPatterns(log.body["subject"], "organization=(?P<v>[^/]+)")["v"])   where IsMatch(log.body["subject"], "organization=")
          - set(log.attributes["crn.environment"],    ExtractPatterns(log.body["subject"], "environment=(?P<v>[^/]+)")["v"])    where IsMatch(log.body["subject"], "environment=")
          - set(log.attributes["crn.cloud_cluster"],  ExtractPatterns(log.body["subject"], "cloud-cluster=(?P<v>[^/]+)")["v"]) where IsMatch(log.body["subject"], "cloud-cluster=")
          - set(log.attributes["crn.kafka"],          ExtractPatterns(log.body["subject"], "kafka=(?P<v>[^/]+)")["v"])          where IsMatch(log.body["subject"], "kafka=")
          - set(log.attributes["crn.schema_registry"],ExtractPatterns(log.body["subject"], "schema-registry=(?P<v>[^/]+)")["v"]) where IsMatch(log.body["subject"], "schema-registry=")
          - set(log.attributes["crn.flink_region"],   ExtractPatterns(log.body["subject"], "flink-region=(?P<v>[^/]+)")["v"])  where IsMatch(log.body["subject"], "flink-region=")
          - set(log.attributes["crn.compute_pool"],   ExtractPatterns(log.body["subject"], "compute-pool=(?P<v>[^/]+)")["v"])  where IsMatch(log.body["subject"], "compute-pool=")

  # ── transform/connector (audit cluster path) ─────────────────────────────────
  # source: crn://confluent.cloud/environment=X/kafka=Y/connector=Z
  transform/connector:
    log_statements:
      - context: log
        statements:
          - set(log.time, Time(log.body["time"], "%Y-%m-%dT%H:%M:%S.%fZ")) where log.body["time"] != nil
          - set(log.attributes["confluent.log.source"], "confluent-connector")
          - set(log.attributes["crn.environment"], ExtractPatterns(log.body["source"], "environment=(?P<v>[^/]+)")["v"]) where IsMatch(log.body["source"], "environment=")
          - set(log.attributes["crn.kafka"],       ExtractPatterns(log.body["source"], "kafka=(?P<v>[^/]+)")["v"])       where IsMatch(log.body["source"], "kafka=")
          - set(log.attributes["crn.connector"],   ExtractPatterns(log.body["source"], "connector=(?P<v>[^/]+)")["v"])   where IsMatch(log.body["source"], "connector=")


exporters:
  debug:
    verbosity: basic
  otlp_http/newrelic:
    endpoint: ${env:NEW_RELIC_OTLP_ENDPOINT}
    headers:
      api-key: ${env:NEW_RELIC_LICENSE_KEY}

service:
  pipelines:
    # Confluent Metrics API → New Relic
    metrics/confluent_metrics:
      receivers: [prometheus/confluent]
      processors: [memory_limiter, batch]
      exporters: [debug, otlp_http/newrelic]

    # Python/Java app OTLP push → New Relic
    metrics/app_metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug, otlp_http/newrelic]

    # Confluent Cloud audit logs → New Relic
    logs/audit:
      receivers: [kafka/audit]
      processors: [memory_limiter, transform/audit, batch]
      exporters: [debug, otlp_http/newrelic]

    # Confluent Cloud connector logs via audit cluster → New Relic
    logs/connector:
      receivers: [kafka/connector_logs]
      processors: [memory_limiter, transform/connector, batch]
      exporters: [debug, otlp_http/newrelic]

