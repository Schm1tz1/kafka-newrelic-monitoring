# OTel Collector config for Confluent Cloud mode.
#
# Always-on pipelines:
#
#   confluent_metrics  — prometheus receiver scrapes the Confluent Metrics API
#                        (api.telemetry.confluent.cloud) every 60 s → New Relic.
#
#   app_metrics        — otlp receiver accepts metrics pushed by the Python/Java
#                        producer/consumer → New Relic.
#
# Optional log pipelines — enabled at config-generation time by start-infra-ccloud.sh
# based on which environment variables are set. Exactly one of the two connector
# log methods should be enabled; both can coexist if needed.
#
#   [AUDIT_LOGS] block — enabled when all three are set:
#     CONFLUENT_AUDIT_BOOTSTRAP_SERVERS, CONFLUENT_AUDIT_SASL_USERNAME,
#     CONFLUENT_AUDIT_SASL_PASSWORD
#
#     audit_logs     — kafka receiver consumes confluent-audit-log-events
#     connector_logs — kafka receiver consumes confluent-connect-log-events
#                      (same audit cluster, same credentials)
#
#   [CLI_CONNECTOR_LOGS] block — enabled when both are set:
#     CONFLUENT_ENVIRONMENT_ID  (env-...)
#     CONFLUENT_CONNECTOR_IDS   (* or comma-separated lcc-... list)
#
#     connector_logs_cli — filelog receiver reads NDJSON from a named pipe
#                          written by infra/scripts/confluent-connector-logs.sh
#                          (the Confluent CLI wrapper). No audit cluster access
#                          required. Produces identical attributes to the
#                          [AUDIT_LOGS] connector_logs pipeline.
#
# Do not edit otel-collector-ccloud.resolved.yaml — it is generated by
# start-infra-ccloud.sh and is git-ignored.
#
# Required env vars (see env.example):
#   NEW_RELIC_LICENSE_KEY, NEW_RELIC_OTLP_ENDPOINT
#   CONFLUENT_API_KEY, CONFLUENT_API_SECRET, CONFLUENT_CLUSTER_ID
#
# Audit log path (Plan A):
#   CONFLUENT_AUDIT_BOOTSTRAP_SERVERS, CONFLUENT_AUDIT_SASL_USERNAME,
#   CONFLUENT_AUDIT_SASL_PASSWORD
#
# CLI wrapper path (CLI wrapper):
#   CONFLUENT_ENVIRONMENT_ID, CONFLUENT_CONNECTOR_IDS (or CONFLUENT_CONNECTOR_ID)

receivers:

  # ── 1. Confluent Metrics API scraper ─────────────────────────────────────────
  prometheus/confluent:
    config:
      scrape_configs:
        - job_name: confluent_cloud
          scrape_interval: 1m
          scrape_timeout: 1m
          honor_timestamps: true
          scheme: https
          static_configs:
            - targets:
                - api.telemetry.confluent.cloud
          basic_auth:
            username: ${env:CONFLUENT_API_KEY}
            password: ${env:CONFLUENT_API_SECRET}
          metrics_path: /v2/metrics/cloud/export
          params:
            "resource.kafka.id":
              # CONFLUENT_CLUSTER_ID_LIST — do not edit this line; start-infra-ccloud.sh
              # replaces it with one "- lkc-xxx" entry per cluster ID at startup time.
              # Set CONFLUENT_CLUSTER_ID to a single ID or a comma-separated list.
              - lkc-2xz7q1
            # Uncomment to also scrape Schema Registry metrics:
            # "resource.schema_registry.id":
            #   - ${env:CONFLUENT_SCHEMA_REGISTRY_ID}
            # Uncomment to also scrape Connector metrics:
            # "resource.connector.id":
            #   - ${env:CONFLUENT_CONNECTOR_ID}

  # ── 2. OTLP receiver — accepts push metrics from the Python/Java app ─────────
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318


  # ── 3c. CLI wrapper connector log consumer ───────────────────────────────────
  # Reads NDJSON lines from a named pipe written by the companion script
  # infra/scripts/confluent-connector-logs.sh, which polls:
  #   confluent connect logs <id> --start-time ... --end-time ... --output json
  # Use this when the cluster does NOT have access to the Confluent audit log
  # cluster. Produces equivalent attributes in New Relic to path 3b above.
  #
  # Each line is a flat JSON object (confluent connect logs schema):
  #   { "timestamp": "...", "level": "ERROR", "message": "...",
  #     "task_id": "task-0", "connector_id": "lcc-xxx",
  #     "exception": { "stacktrace": "..." } }
  file_log/connector_cli:
    include:
      - /fifo/connector-logs.fifo
    start_at: beginning
    operators:
      # Parse the raw JSON line into the log body map
      - type: json_parser
        parse_from: body
        parse_to: body
      # Promote the flat `level` field to OTel severity
      - type: severity_parser
        parse_from: body["level"]
        preset: default
        mapping:
          fatal:  FATAL
          error:  ERROR
          warn:   WARN
          info:   INFO
          debug:  DEBUG
          trace:  TRACE

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
  batch:
    send_batch_size: 1024
    timeout: 10s


  # ── transform/connector_cli (CLI wrapper path) ───────────────────────────────
  # Maps the flat `confluent connect logs` JSON schema to NR attributes.
  # confluent.log.source = "confluent-connector-cli" lets you distinguish the
  # ingestion method in NR queries if both paths are ever active simultaneously.
  transform/connector_cli:
    log_statements:
      - context: log
        statements:
          # Use the log entry's own timestamp as the OTel record time
          - set(log.time, Time(log.body["timestamp"], "%Y-%m-%dT%H:%M:%S.%fZ")) where log.body["timestamp"] != nil
          - set(log.attributes["confluent.log.source"],    "confluent-connector-cli")
          # Flat fields from `confluent connect logs --output json`
          - set(log.attributes["crn.connector"],           log.body["connector_id"])           where log.body["connector_id"] != nil
          - set(log.attributes["connector.log.level"],     log.body["level"])                  where log.body["level"] != nil
          - set(log.attributes["connector.log.message"],   log.body["message"])                where log.body["message"] != nil
          - set(log.attributes["connector.log.task_id"],   log.body["task_id"])                where log.body["task_id"] != nil
          - set(log.attributes["connector.log.stacktrace"],log.body["exception"]["stacktrace"]) where log.body["exception"] != nil

exporters:
  debug:
    verbosity: basic
  otlp_http/newrelic:
    endpoint: ${env:NEW_RELIC_OTLP_ENDPOINT}
    headers:
      api-key: ${env:NEW_RELIC_LICENSE_KEY}

service:
  pipelines:
    # Confluent Metrics API → New Relic
    metrics/confluent_metrics:
      receivers: [prometheus/confluent]
      processors: [memory_limiter, batch]
      exporters: [debug, otlp_http/newrelic]

    # Python/Java app OTLP push → New Relic
    metrics/app_metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug, otlp_http/newrelic]


    # Confluent Cloud connector logs via CLI wrapper → New Relic
    logs/connector_cli:
      receivers: [file_log/connector_cli]
      processors: [memory_limiter, transform/connector_cli, batch]
      exporters: [debug, otlp_http/newrelic]
