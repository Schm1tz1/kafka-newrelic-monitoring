# docker-compose.cp.yml — Confluent Platform (local) mode.
#
# Starts three services for the CP use-case:
#   kafka          — single-node KRaft broker with jmx_prometheus_javaagent on :1234
#   otel-collector — receives OTLP push metrics from the Python app → New Relic
#   nri-prometheus — scrapes Kafka JMX metrics on :1234 → New Relic directly
#
# Usage (via start-infra-cp.sh, or manually):
#   docker compose -f docker-compose.cp.yml up -d
#
# Required env vars: NEW_RELIC_LICENSE_KEY, NEW_RELIC_OTLP_ENDPOINT

services:

  # ── Kafka broker (KRaft, single-node) with JMX Prometheus Java Agent ─────────
  kafka:
    image: confluentinc/cp-kafka:8.3.1
    hostname: kafka
    ports:
      - "29092:29092"
      # Expose broker JMX port for nri-jmx / OTel JMX receiver scraping from the host.
      # The jmx_prometheus_javaagent already exposes Prometheus metrics on :1234.
      - "1234:1234"
    volumes:
      - ./jmx-exporter:/usr/share/jmx-exporter:ro
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: CONTROLLER://:9093,PLAINTEXT://:9092,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # Attach JMX exporter on port 1234 — rules from confluentinc/jmx-monitoring-stacks
      EXTRA_ARGS: >-
        -javaagent:/usr/share/jmx-exporter/jmx_prometheus_javaagent-1.0.1.jar=1234:/usr/share/jmx-exporter/kafka_broker.yml
    networks:
      - kafka-monitoring

  # ── OTel Collector — OTLP push metrics + Kafka broker log ingestion ──────────
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.160.0
    command: ["--config=/etc/otelcol-contrib/otel-collector.yaml"]
    environment:
      NEW_RELIC_LICENSE_KEY: ${NEW_RELIC_LICENSE_KEY:?Set NEW_RELIC_LICENSE_KEY before starting the Collector}
      NEW_RELIC_OTLP_ENDPOINT: ${NEW_RELIC_OTLP_ENDPOINT:-https://otlp.eu01.nr-data.net}
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:-dev}
    volumes:
      - ./collector/otel-collector.yaml:/etc/otelcol-contrib/otel-collector.yaml:ro
      # Docker JSON log files — the filelog receiver tails kafka*.log inside the
      # Collector container. Files are read-only; no Docker socket needed.
      - /var/lib/docker/containers:/var/log/containers:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    networks:
      - kafka-monitoring

  # ── nri-prometheus — scrapes Kafka JMX endpoint → New Relic directly ─────────
  nri-prometheus:
    image: newrelic/nri-prometheus:2.30.0
    container_name: nri-prometheus
    restart: unless-stopped
    environment:
      LICENSE_KEY: ${NEW_RELIC_LICENSE_KEY:?Set NEW_RELIC_LICENSE_KEY before starting nri-prometheus}
    volumes:
      - ./jmx-exporter/nri-prometheus-config.yaml:/config.yaml:ro
    depends_on:
      - kafka
    networks:
      - kafka-monitoring

networks:
  kafka-monitoring:
    name: kafka-monitoring

  # ── Option A: nri-jmx — scrapes application JMX MBeans → New Relic directly ──
  # Uncomment to monitor the Java app's own JVM/JMX metrics (heap, GC, threads,
  # Kafka client MBeans) via New Relic's native JMX integration.
  #
  # Prerequisites:
  #   1. Start the Java app with JMX enabled and no auth (local dev only):
  #        java -Dcom.sun.management.jmxremote \
  #             -Dcom.sun.management.jmxremote.port=9999 \
  #             -Dcom.sun.management.jmxremote.authenticate=false \
  #             -Dcom.sun.management.jmxremote.ssl=false \
  #             -cp applications/java/target/kafka-monitoring-1.0-SNAPSHOT.jar \
  #             com.example.kafka.Consumer
  #   2. Uncomment the service below and run docker compose up.
  #
  # nri-jmx:
  #   image: newrelic/nri-jmx:3.7.0
  #   network_mode: host          # reach jmxremote port on the host
  #   environment:
  #     NRI_JMX_HOST: localhost
  #     NRI_JMX_PORT: "9999"
  #     NRIA_LICENSE_KEY: ${NEW_RELIC_LICENSE_KEY}
  #   volumes:
  #     - ./jmx-exporter/nri-jmx-app-config.yml:/etc/newrelic-infra/integrations.d/jmx-config.yml:ro

  # ── Option B: New Relic Java Agent — attach to the Java app process ───────────
  # No Docker service needed. Run the Java app directly with:
  #
  #   # 1. Download the agent once:
  #   ./applications/java/newrelic/download-nr-agent.sh
  #
  #   # 2. Run with agent attached:
  #   java -javaagent:applications/java/newrelic/newrelic.jar \
  #        -Dnewrelic.config.file=applications/java/newrelic/newrelic.yml \
  #        -cp applications/java/target/kafka-monitoring-1.0-SNAPSHOT.jar \
  #        com.example.kafka.Consumer
  #
  # The agent auto-instruments Kafka client calls (producer.send, consumer.poll),
  # adds JVM metrics (heap, GC, threads), and enables distributed tracing.
  # See applications/java/newrelic/newrelic.yml for configuration.
