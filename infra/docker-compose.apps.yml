# docker-compose.apps.yml — application services (Python + Java producers/consumers).
#
# All services use Docker profiles so they never start automatically.
# Can be used standalone or overlaid on an infra compose file.
#
# Standalone (infra already running separately):
#   docker compose -f infra/docker-compose.apps.yml --profile python-confluent up -d
#
# Overlaid (infra + apps in one command):
#   docker compose -f infra/docker-compose.cp.yml \
#                  -f infra/docker-compose.apps.yml \
#                  --profile python-confluent up -d
#
# Either way, all containers join the shared 'kafka-monitoring' network so they
# can reach each other by service name (kafka:9092, otel-collector:4317).
# The network must already exist when running standalone — it is created by the
# infra compose files. Run infra first, then apps.
#
# Available profiles:
#   python-confluent    confluent-kafka producer + consumer
#   python-faststream   FastStream/confluent producer + consumer
#   python-aiokafka     FastStream/aiokafka producer + consumer
#   java                Java producer + consumer (plain OTel SDK)
#   java-nr-agent       Java producer + consumer with New Relic -javaagent
#
# Prerequisites:
#   Build images: docker compose -f infra/docker-compose.apps.yml build
#   Java fat jar: cd applications/java && mvn package -q
#
# Env vars — read from .env at the repo root.
# KAFKA_BOOTSTRAP_SERVERS defaults to kafka:9092 (Docker-internal CP name).
# For CCloud set KAFKA_BOOTSTRAP_SERVERS to your cluster bootstrap endpoint in .env.

x-python-common: &python-common
  build:
    context: ..
    dockerfile: applications/python/Dockerfile
  env_file: ../.env
  # OTEL_EXPORTER_OTLP_ENDPOINT is a literal value to override the localhost
  # default in .env — Docker Compose :-defaults only fire when the variable is
  # completely unset, not when it is set to a different value in env_file.
  networks:
    - kafka-monitoring
  restart: "no"

x-java-common: &java-common
  build:
    context: ..
    dockerfile: applications/java/Dockerfile
  env_file: ../.env
  networks:
    - kafka-monitoring
  restart: "no"

services:

  # ── Python / confluent-kafka ──────────────────────────────────────────────────
  python-confluent-producer:
    <<: *python-common
    profiles: [python-confluent]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      MODULE: applications.python.confluent_kafka.producer
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-python-confluent-producer}

  python-confluent-consumer:
    <<: *python-common
    profiles: [python-confluent]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      MODULE: applications.python.confluent_kafka.consumer
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-python-confluent-consumer}

  # ── Python / FastStream + confluent-kafka ─────────────────────────────────────
  python-faststream-confluent-producer:
    <<: *python-common
    profiles: [python-faststream]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      MODULE: applications.python.faststream_confluent.producer
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-python-faststream-confluent-producer}

  python-faststream-confluent-consumer:
    <<: *python-common
    profiles: [python-faststream]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      MODULE: applications.python.faststream_confluent.consumer
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-python-faststream-confluent-consumer}

  # ── Python / FastStream + aiokafka ────────────────────────────────────────────
  python-aiokafka-producer:
    <<: *python-common
    profiles: [python-aiokafka]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      MODULE: applications.python.faststream_aiokafka.producer
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-python-aiokafka-producer}

  python-aiokafka-consumer:
    <<: *python-common
    profiles: [python-aiokafka]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      MODULE: applications.python.faststream_aiokafka.consumer
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-python-aiokafka-consumer}

  # ── Java / plain OTel SDK ─────────────────────────────────────────────────────
  java-producer:
    <<: *java-common
    profiles: [java]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      MAIN_CLASS: com.example.kafka.Producer
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-java-kafka-producer}

  java-consumer:
    <<: *java-common
    profiles: [java]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      MAIN_CLASS: com.example.kafka.Consumer
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-java-kafka-consumer}

  # ── Java / New Relic -javaagent ───────────────────────────────────────────────
  # Requires newrelic.jar downloaded via applications/java/newrelic/download-nr-agent.sh
  java-nr-agent-producer:
    <<: *java-common
    profiles: [java-nr-agent]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      MAIN_CLASS: com.example.kafka.Producer
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-java-kafka-producer}
      NEW_RELIC_LICENSE_KEY: ${NEW_RELIC_LICENSE_KEY}
      NEW_RELIC_APP_NAME: ${NEW_RELIC_APP_NAME:-java-kafka-producer}
      JAVA_OPTS: >-
        -javaagent:/app/newrelic.jar
        -Dnewrelic.config.file=/app/newrelic.yml
    volumes:
      - ../applications/java/newrelic/newrelic.jar:/app/newrelic.jar:ro
      - ../applications/java/newrelic/newrelic.yml:/app/newrelic.yml:ro

  java-nr-agent-consumer:
    <<: *java-common
    profiles: [java-nr-agent]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      MAIN_CLASS: com.example.kafka.Consumer
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-java-kafka-consumer}
      NEW_RELIC_LICENSE_KEY: ${NEW_RELIC_LICENSE_KEY}
      NEW_RELIC_APP_NAME: ${NEW_RELIC_APP_NAME:-java-kafka-consumer}
      JAVA_OPTS: >-
        -javaagent:/app/newrelic.jar
        -Dnewrelic.config.file=/app/newrelic.yml
    volumes:
      - ../applications/java/newrelic/newrelic.jar:/app/newrelic.jar:ro
      - ../applications/java/newrelic/newrelic.yml:/app/newrelic.yml:ro

networks:
  kafka-monitoring:
    external: true
    name: kafka-monitoring
